# ===================================================
# ChangeGuard Spring Boot Configuration
# ===================================================

server.port=8080

# PostgreSQL Connection Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/changeguard}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Python FastAPI Machine Learning Service URL
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
changeguard.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}
changeguard.ml-service.timeout-ms=${ML_SERVICE_TIMEOUT_MS:3000}

# ===================================================
# Phase 5: Rule-Based Risk Engine Configuration
# ===================================================
changeguard.risk.weights.complexity=0.15
changeguard.risk.weights.dependency=0.10
changeguard.risk.weights.depth=0.10
changeguard.risk.weights.criticality=0.15
changeguard.risk.weights.incident=0.15
changeguard.risk.weights.change-type=0.10
changeguard.risk.weights.critical-service=0.10
changeguard.risk.weights.blast-radius=0.15

changeguard.risk.thresholds.low=0.30
changeguard.risk.thresholds.medium=0.60
changeguard.risk.thresholds.high=0.80

changeguard.risk.defaults.max-relevant-dependencies=10
changeguard.risk.defaults.max-depth=5
changeguard.risk.defaults.historical-failure-rate=0.20

# Logging
logging.level.com.changeguard=INFO
logging.level.org.springframework.web=INFO

# GitHub Pull Request risk assessment integration
changeguard.github.webhook-secret=${CHANGEGUARD_GITHUB_WEBHOOK_SECRET:}
changeguard.github.token=${CHANGEGUARD_GITHUB_TOKEN:}
changeguard.github.repository-service-map=${CHANGEGUARD_GITHUB_REPOSITORY_SERVICE_MAP:}
