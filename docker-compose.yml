version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: changeguard-postgres
    environment:
      POSTGRES_DB: changeguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d changeguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Machine Learning Inference Microservice
  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    container_name: changeguard-ml-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - postgres

  # 3. Java Spring Boot REST Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: changeguard-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/changeguard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ML_SERVICE_URL: http://ml-service:8000
      CHANGEGUARD_GITHUB_WEBHOOK_SECRET: ${CHANGEGUARD_GITHUB_WEBHOOK_SECRET:-}
      CHANGEGUARD_GITHUB_TOKEN: ${CHANGEGUARD_GITHUB_TOKEN:-}
      CHANGEGUARD_GITHUB_REPOSITORY_SERVICE_MAP: ${CHANGEGUARD_GITHUB_REPOSITORY_SERVICE_MAP:-}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # 4. React Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: changeguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
